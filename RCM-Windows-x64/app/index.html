      }
      .skeleton-logo-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .skeleton-title-ar {

      .skeleton-progress-track {

        background-color: #17332A;
        border: 1px solid rgba(211, 175, 98, 0.25);

      }
      .skeleton-progress-bar {
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #A98A45, #E5CEA1, #D3AF62);

  <body class="bg-[#F3F8F4] text-[#1B3123] font-sans antialiased overflow-x-hidden selection:bg-[#326445] selection:text-white">
    <div id="app">
      <!-- 纯原生首屏冷启动骨架启动页 (秒开过渡，Vue mount 后即被完全接管) -->
      <div id="app-skeleton-splash">
        <div class="skeleton-splash-header"></div>
        <div class="skeleton-splash-center">
          <div class="skeleton-logo-card">
            <img src="/logo.svg" alt="Official Logo" class="skeleton-logo-img" />
          </div>
          <h1 class="skeleton-title-ar">البطاقة التموينية</h1>
          <h2 class="skeleton-title-en">Ration Card Management</h2>
          <p class="skeleton-org-ar">جمهورية العراق · وزارة التجارة</p>
          <p class="skeleton-org-en">Republic of Iraq · Ministry of Trade</p>
        </div>
        <div class="skeleton-splash-footer">
          <div class="skeleton-progress-track">
            <div class="skeleton-progress-bar"></div>
          </div>
          <div class="skeleton-status-text" id="skeleton-status-text">系统初始化中…</div>
        </div>
      </div>
    </div>
    <script>
      // 首屏过渡层国际化：在 Vue/i18n 尚未加载前同步读取持久化语言偏好（与 src/locales/index.js 的 rcm_language 键保持一致）
      (function () {
        var langMap = {
          zh: '系统初始化中…',
          en: 'System Initializing...',
          ar: 'جارٍ تهيئة النظام...',
          ku: 'سیستەم ئامادە دەکات...'
        };
        var lang = 'zh';
        try {
          var saved = window.localStorage && window.localStorage.getItem('rcm_language');
          if (saved && langMap[saved]) lang = saved;
        } catch (e) { /* 隐私模式下 localStorage 不可用时保持默认 */ }
        var el = document.getElementById('skeleton-status-text');
        if (el) el.textContent = langMap[lang];
        document.documentElement.setAttribute('lang', lang);
      })();
    </script>
  </body>
